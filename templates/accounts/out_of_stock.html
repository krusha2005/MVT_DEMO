{% extends 'base.html' %}

{% block title %} out_of_stock {% endblock %}

{% block content %}

<div class="container mt-3">

    <h4>Out Of Stock</h4>

    <div class="row mb-3">

        {% for product in products %}

        <div class="col-md-3">

            <div class="card shadow-sm p-2">

                <img src="{{ product.images.first.image.url }}" class="img-fluid" style="object-fit: cover; height: 250px;">

                <div class="card-body" style="height: 180px;">
                    <h5>
                        {{product.name }}
                    </h5>

                    <p>Price: ₹
                        {{ product.price }}
                    </p>

                    <p>
                        Stock: {{ product.stock }}
                    </p>

                    <a href="{% url 'edit_product' product.id %}" class="btn btn-outline-primary"> Update Stock</a>
                </div>

            </div>
        </div>

        {% empty %}
            <h5> No Out Of Stock Products!</h5>
        {% endfor %}

    </div>
</div>
{% endblock %}
