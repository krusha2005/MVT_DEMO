{% extends 'base.html' %}

{% block title %} Add Category {% endblock %}

{% block content %}

<div class="container mt-4">

    <h2>Add Category</h2>

    <hr>

    <form method="post" enctype="multipart/form-data">

        {% csrf_token %}

        {{ form.as_p }}

        <button class="btn btn-outline-success" type="submit">Save Category</button>

    </form>
    
</div>
{% endblock %}
